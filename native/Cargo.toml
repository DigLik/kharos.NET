[package]
name = "kharos-native"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Нативная оболочка Kharos: окно, OpenGL и JS-рантайм вместо браузера"

[dependencies]
anyhow = "1"
deno_core = "0.412"
deno_error = "=0.7.1"
flate2 = "1.1.10"
glow = "0.18"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
rustybuzz = "0.20.1"
serde = { version = "1", features = ["derive"] }
tiny-skia = "0.11"
tokio = { version = "1", features = ["rt", "time"] }
winit = "0.30"

# Значок в Доке (см. src/icon.rs): те же версии, что тянет winit, — сборка их уже знает.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.2.2", features = ["NSData"] }

[profile.dev]
opt-level = 1

# Прод-сборка окна: символов у рантайма примерно четверть веса, и нужны они только отладчику — у стрипнутого
# бинарника они сняты. Кода в одной части ещё плотнее (одна единица на крейт), но это редкая сборка, её зовут не к
# каждой правке, а к выпуску.
[profile.release]
strip = "symbols"
codegen-units = 1

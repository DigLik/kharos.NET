[package]
name = "kharos-sim"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Системы симуляции Kharos: правила игры поверх движка (docs/engine.md, §4)"

[dependencies]
kharos-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

name: .NET

# Линия .NET (docs/dotnet.md): сборка и тесты на Windows и Linux (macOS вне плана, docs/dotnet-n7.md Н7.9).
# TS-задания не трогает. Через workflow_call его же берёт release.yml.
#
# Устройство: моды в wasm собираются один раз (задание mods, артефакт ci-mods; при тех же исходниках — из кэша), тесты —
# параллельными частями на каждой ОС: Base.Tests тремя частями по пространствам имён, Kharos.Gpu.Tests и
# Kharos.Desktop.Tests — своими (на WARP и lavapipe это самые долгие), все прочие проекты — одной. Тесты
# идут на host.wasm и client.wasm (KHAROS_MODS=wasm): модуль компилируется раз на процесс, а в режиме CLR каждая партия
# заново компилирует JIT-ом весь мод (Sim.DefaultMode).
on:
  push:
    paths:
      - 'dotnet/**'
      - '.github/workflows/dotnet.yml'
  pull_request:
    paths:
      - 'dotnet/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      os:
        description: 'JSON-массив ОС для тестов; пусто — все три'
        type: string
        default: ''
      skip-package:
        description: 'true — не собирать пробный пакет (release.yml собирает свои)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  # Части Base.Tests по пространствам имён Kharos.Base.Tests.*; всё, что не названо, — в части base-rest (так новый
  # раздел не выпадет из прогона). Время частей примерно равное.
  BASE_SIM_1: Kernel Combat Construction Defense Missiles Tactics
  BASE_SIM_2: Energy Logistics Players Researching Mining Production Pipes Trade Movement Harness Data Layers Balance

jobs:
  # Моды в wasm (NativeAOT-LLVM, docs/dotnet.md Р5): .wasm у всех ОС один, собираем раз на Linux x64. Те же исходники —
  # те же .wasm из кэша (ключ — исходники модов, SDK модов и настройки сборки).
  mods:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: built
        uses: actions/cache@v6
        with:
          path: |
            dotnet/mods/*/host.wasm
            dotnet/mods/*/client.wasm
          key: mods-${{ hashFiles('dotnet/mods/**/*.cs', 'dotnet/mods/**/*.csproj', 'dotnet/mods/**/*.props', 'dotnet/mods/**/*.targets', 'dotnet/src/Kharos.Mod.Sdk/**', 'dotnet/src/Kharos.Engine/Math/DetMath*.cs', 'dotnet/Directory.Build.props', 'dotnet/Directory.Packages.props', 'dotnet/global.json', 'dotnet/nuget.config', 'dotnet/tools/build-mods.ps1', 'dotnet/tools/wasi-sdk.*') }}
      - uses: actions/setup-dotnet@v6
        if: steps.built.outputs.cache-hit != 'true'
        with:
          global-json-file: dotnet/global.json
      - uses: actions/cache@v6
        if: steps.built.outputs.cache-hit != 'true'
        with:
          path: dotnet/.cache/wasi-sdk
          key: wasi-sdk-29-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/cache@v6
        if: steps.built.outputs.cache-hit != 'true'
        with:
          path: ~/.nuget/packages
          key: nuget-mods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dotnet/Directory.Packages.props', 'dotnet/nuget.config', 'dotnet/global.json') }}
          restore-keys: nuget-mods-${{ runner.os }}-${{ runner.arch }}-
      - run: pwsh dotnet/tools/build-mods.ps1
        if: steps.built.outputs.cache-hit != 'true'
      # tar сохраняет пути dotnet/mods/<мод>/*.wasm (upload-artifact отбросил бы общий префикс). Имя — не «mods»: тот же
      # прогон release.yml выкладывает свой артефакт mods.
      - run: tar -cf mods.tar dotnet/mods/*/host.wasm dotnet/mods/*/client.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: ci-mods
          path: mods.tar
          if-no-files-found: error
          retention-days: 3

  test:
    needs: mods
    name: test (${{ matrix.os }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest","ubuntu-24.04-arm","windows-latest"]') }}
        shard: [base-sim-1, base-sim-2, base-rest, gpu, desktop, other]
    runs-on: ${{ matrix.os }}
    # Зависший тест не держит машину часами (по умолчанию — 6 ч).
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dotnet
        shell: bash
    env:
      SHARD: ${{ matrix.shard }}
      # Моды из артефакта — тесты на wasm, как в игре (без переменной Sim.DefaultMode сверял бы их свежесть с исходниками).
      KHAROS_MODS: wasm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: dotnet/global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dotnet/Directory.Packages.props', 'dotnet/nuget.config', 'dotnet/global.json', 'dotnet/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-
      # Lavapipe — частям с кадрами на GPU (клиент base, Kharos.Gpu.Tests, десктоп, клиент hello).
      - name: Mesa Vulkan
        if: runner.os == 'Linux' && matrix.shard != 'base-sim-1' && matrix.shard != 'base-sim-2'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      # Моды — до сборки: Kharos.Desktop копирует mods/*/*.wasm себе в bin при сборке.
      - uses: actions/download-artifact@v8
        with:
          name: ci-mods
      - run: tar -xf mods.tar
        working-directory: .
      - name: Сборка
        run: |
          case "$SHARD" in
            base-*) dotnet build tests/Kharos.Base.Tests/Kharos.Base.Tests.csproj -c Release ;;
            gpu) dotnet build tests/Kharos.Gpu.Tests/Kharos.Gpu.Tests.csproj -c Release ;;
            desktop) dotnet build tests/Kharos.Desktop.Tests/Kharos.Desktop.Tests.csproj -c Release ;;
            *) dotnet build Kharos.slnx -c Release ;;
          esac
      # Тест, висящий дольше 10 минут, обрывается и попадает в отчёт.
      - name: Тесты
        env:
          # Сверка кадров идёт на программном адаптере: видеокарты на раннере нет (Linux — lavapipe, Windows — WARP).
          KHAROS_GPU_ADAPTER: ${{ runner.os == 'Linux' && 'software' || '' }}
        run: |
          any() { local f=""; for n in "$@"; do f="$f${f:+|}FullyQualifiedName~Kharos.Base.Tests.$n."; done; echo "$f"; }
          none() { local f=""; for n in "$@"; do f="$f${f:+&}FullyQualifiedName!~Kharos.Base.Tests.$n."; done; echo "$f"; }
          base=tests/Kharos.Base.Tests/Kharos.Base.Tests.csproj
          case "$SHARD" in
            base-sim-1) target=$base; filter=$(any $BASE_SIM_1) ;;
            base-sim-2) target=$base; filter=$(any $BASE_SIM_2) ;;
            base-rest) target=$base; filter=$(none $BASE_SIM_1 $BASE_SIM_2) ;;
            gpu) target=tests/Kharos.Gpu.Tests/Kharos.Gpu.Tests.csproj; filter='' ;;
            desktop) target=tests/Kharos.Desktop.Tests/Kharos.Desktop.Tests.csproj; filter='' ;;
            other) target=Kharos.slnx; filter='FullyQualifiedName!~Kharos.Base.Tests.&FullyQualifiedName!~Kharos.Gpu.Tests.&FullyQualifiedName!~Kharos.Desktop.Tests.' ;;
          esac
          echo "$target: ${filter:-все тесты}"
          dotnet test "$target" -c Release --no-build ${filter:+--filter "$filter"} --logger GitHubActions --blame-hang-timeout 10m --blame-hang-dump-type none
      # Песочница модов на этой ОС: Wasmtime, пул, сторож эпох, белый список импортов.
      - if: matrix.shard == 'other'
        run: dotnet run --project tools/Kharos.Plugins.Bench -c Release --no-build -- --security

  # Пробный пакет linux-x64: публикация NativeAOT, состав архива и смоук одиночной игры (Н7.4, Н7.3).
  package:
    if: ${{ !inputs.skip-package }}
    needs: mods
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: dotnet/global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dotnet/Directory.Packages.props', 'dotnet/nuget.config', 'dotnet/global.json', 'dotnet/**/*.csproj') }}
          restore-keys: nuget-package-${{ runner.os }}-${{ runner.arch }}-
      - name: Пакеты ОС
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev xvfb mesa-vulkan-drivers libasound2
      - uses: actions/download-artifact@v8
        with:
          name: ci-mods
      - run: tar -xf mods.tar
      - name: Упаковка
        run: sh dotnet/tools/package.sh linux-x64 desktop "0.2.0-ci.${{ github.run_number }}" "$RUNNER_TEMP/out"
      # Оркестратор смоука (dotnet/tools/smoke.ps1, П2): вызов в одном месте, чтобы править в одном месте.
      - name: Смоук пакета
        env:
          KHAROS_GPU_ADAPTER: software
        run: |
          smoke() { xvfb-run -a pwsh dotnet/tools/smoke.ps1 single -Package "$RUNNER_TEMP/out"; }
          if ! smoke; then
            echo "::warning::Смоук с lavapipe не прошёл, повтор без GPU (KHAROS_GPU=none)"
            KHAROS_GPU=none smoke
          fi
